name: Sync with Upstream

env:
  UPSTREAM_REPO: JulienGitHub/pokemon-tcg-data

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master          # sync happens on the upstream mirror branch
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || true
          git remote set-url upstream https://github.com/${UPSTREAM_REPO}.git

      - name: Fetch upstream changes
        run: git fetch upstream

      - name: Check for updates
        id: check
        run: |
          # Get the latest commit from upstream main/master
          UPSTREAM_BRANCH="master"
          if git rev-parse --verify upstream/master >/dev/null 2>&1; then
            UPSTREAM_BRANCH="master"
          fi

          UPSTREAM_COMMIT=$(git rev-parse upstream/$UPSTREAM_BRANCH)
          LOCAL_COMMIT=$(git rev-parse HEAD)

          echo "upstream_branch=$UPSTREAM_BRANCH" >> $GITHUB_OUTPUT
          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "local_commit=$LOCAL_COMMIT" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_COMMIT" != "$LOCAL_COMMIT" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates available from upstream"
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Already up to date with upstream"
          fi

      - name: Merge upstream changes
        id: merge
        if: steps.check.outputs.has_updates == 'true'
        run: |
          UPSTREAM_BRANCH=${{ steps.check.outputs.upstream_branch }}
          echo "dev_merge_conflict=false" >> $GITHUB_OUTPUT

          # Keep master mirror-like: prefer upstream on content conflicts
          if git merge -X theirs upstream/$UPSTREAM_BRANCH --no-edit; then
            echo "Successfully merged upstream changes into master"
            git push origin master

            # propagate these updates into dev branch (and thereby into release via downstream workflow)
            if git show-ref --verify --quiet refs/heads/dev; then
              git checkout dev
            else
              git checkout -b dev origin/dev
            fi

            if git merge master --no-edit; then
              echo "Successfully merged master into dev"
              git push origin dev
            else
              echo "Conflict merging master into dev" >&2
              git merge --abort
              echo "dev_merge_conflict=true" >> $GITHUB_OUTPUT
            fi

            # switching back to master for next actions
            git checkout master
          else
            echo "Merge conflict detected. Creating an issue for manual resolution."
            git merge --abort
            exit 1
          fi

      - name: Create issue on merge conflict
        if: failure() || steps.merge.outputs.dev_merge_conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const conflictType = '${{ steps.merge.outputs.dev_merge_conflict }}' === 'true'
              ? 'master→dev merge conflict'
              : 'upstream→master merge conflict';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Upstream Sync Conflict - Manual Resolution Required',
              body: `The automated sync workflow encountered a merge conflict.

              **Conflict Type:** ${conflictType}

              **Action Required:**
              Please manually sync with the upstream repository and resolve any conflicts.

              **Steps:**
              1. \`git fetch upstream\`
              2. \`git checkout master\`
              3. \`git merge upstream/master\` (or \`upstream/main\`)
              4. Resolve conflicts
              5. \`git push origin master\`

              6. Optionally merge master into dev and push:
                 \`\`\`sh
                 git checkout dev
                 git merge master
                 git push origin dev
                 \`\`\`

              **Upstream Repository:** https://github.com/${process.env.UPSTREAM_REPO}

              Once resolved, updates to \`dev\` will automatically be merged into \`release\` and deployed.`,
              labels: ['upstream-sync', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
