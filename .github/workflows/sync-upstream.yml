name: Sync with Upstream

env:
  UPSTREAM_REPO: JulienGitHub/pokemon-tcg-data

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - master
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master          # sync happens on the upstream mirror branch
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync master with upstream
        id: sync_upstream
        if: github.event_name != 'push'
        run: |
          echo "master_updated=false" >> $GITHUB_OUTPUT
          echo "conflict_type=" >> $GITHUB_OUTPUT

          git remote add upstream https://github.com/${UPSTREAM_REPO}.git || true
          git remote set-url upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream

          UPSTREAM_BRANCH="master"
          UPSTREAM_COMMIT=$(git rev-parse upstream/$UPSTREAM_BRANCH)
          LOCAL_COMMIT=$(git rev-parse HEAD)

          if [ "$UPSTREAM_COMMIT" = "$LOCAL_COMMIT" ]; then
            echo "Already up to date with upstream"
            exit 0
          fi

          if git merge -X theirs upstream/$UPSTREAM_BRANCH --no-edit; then
            echo "Successfully merged upstream changes into master"
            git push origin master
            echo "master_updated=true" >> $GITHUB_OUTPUT
          else
            git merge --abort
            echo "conflict_type=upstream->master" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Mark master push update
        id: mark_push
        if: github.event_name == 'push'
        run: |
          echo "master_updated=true" >> $GITHUB_OUTPUT

      - name: Resolve update state
        id: state
        run: |
          MASTER_UPDATED="${{ steps.sync_upstream.outputs.master_updated }}"
          if [ -z "$MASTER_UPDATED" ]; then
            MASTER_UPDATED="${{ steps.mark_push.outputs.master_updated }}"
          fi
          echo "master_updated=${MASTER_UPDATED:-false}" >> $GITHUB_OUTPUT

      - name: Propagate master to dev and release
        id: propagate
        if: steps.state.outputs.master_updated == 'true'
        run: |
          echo "conflict_target=" >> $GITHUB_OUTPUT

          merge_target () {
            TARGET="$1"
            git fetch origin "$TARGET" || true

            if git ls-remote --exit-code --heads origin "$TARGET" >/dev/null 2>&1; then
              git checkout -B "$TARGET" "origin/$TARGET"
            else
              git checkout -B "$TARGET" master
            fi

            if git merge -X theirs master --no-edit; then
              git push origin "$TARGET"
            else
              git merge --abort
              echo "conflict_target=$TARGET" >> $GITHUB_OUTPUT
              exit 1
            fi
          }

          merge_target dev
          merge_target release

          git checkout master

      - name: Create issue on merge conflict
        if: failure()
        env:
          SYNC_CONFLICT: ${{ steps.sync_upstream.outputs.conflict_type }}
          PROPAGATE_CONFLICT: ${{ steps.propagate.outputs.conflict_target }}
        uses: actions/github-script@v7
        with:
          script: |
            const syncConflict = process.env.SYNC_CONFLICT || '';
            const propagateConflict = process.env.PROPAGATE_CONFLICT || '';
            const conflictType = syncConflict
              ? syncConflict
              : (propagateConflict ? `master->${propagateConflict}` : 'unknown');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Upstream Sync Conflict - Manual Resolution Required',
              body: `The automated sync workflow encountered a merge conflict.

              **Conflict Type:** ${conflictType}

              **Action Required:**
              Please manually sync with the upstream repository and resolve any conflicts.

              **Steps:**
              1. \`git fetch upstream\`
              2. \`git checkout master\`
              3. \`git merge upstream/master\` (or \`upstream/main\`)
              4. Resolve conflicts
              5. \`git push origin master\`

                6. Merge master into dev and release:
                 \`\`\`sh
                 git checkout dev
                  git merge -X theirs master
                 git push origin dev

                  git checkout release
                  git merge -X theirs master
                  git push origin release
                 \`\`\`

              **Upstream Repository:** https://github.com/${process.env.UPSTREAM_REPO}

                Once resolved, updates on \`release\` and \`dev\` are deployed to GitHub Pages.`,
              labels: ['upstream-sync', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
