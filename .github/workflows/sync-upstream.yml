name: Daily Sync All Upstreams to Master

env:
  PRIMARY_UPSTREAM_REPO: PokemonTCG/pokemon-tcg-data
  SECONDARY_UPSTREAM_REPO: JulienGitHub/pokemon-tcg-data

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync_upstreams_to_master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync master with both upstreams
        id: sync_upstreams
        run: |
          echo "conflict_target=" >> $GITHUB_OUTPUT
          echo "master_updated=false" >> $GITHUB_OUTPUT

          START_COMMIT=$(git rev-parse HEAD)

          sync_remote () {
            REMOTE_NAME="$1"
            REMOTE_REPO="$2"
            REMOTE_BRANCH="${3:-master}"

            git remote add "$REMOTE_NAME" "https://github.com/${REMOTE_REPO}.git" || true
            git remote set-url "$REMOTE_NAME" "https://github.com/${REMOTE_REPO}.git"
            git fetch "$REMOTE_NAME" "$REMOTE_BRANCH"

            if ! git merge -X theirs "$REMOTE_NAME/$REMOTE_BRANCH" --no-edit; then
              git merge --abort || true
              echo "conflict_target=$REMOTE_NAME/$REMOTE_BRANCH" >> $GITHUB_OUTPUT
              exit 1
            fi
          }

          sync_remote pokemontcg "${PRIMARY_UPSTREAM_REPO}" master
          sync_remote julien "${SECONDARY_UPSTREAM_REPO}" master

          END_COMMIT=$(git rev-parse HEAD)

          if [ "$START_COMMIT" != "$END_COMMIT" ]; then
            echo "Master changed after upstream sync; pushing updated integration branch"
            git push origin master
            echo "master_updated=true" >> $GITHUB_OUTPUT
          else
            echo "Master already up to date with both upstreams"
          fi

      - name: Create issue on merge conflict
        if: failure()
        env:
          SYNC_CONFLICT_TARGET: ${{ steps.sync_upstreams.outputs.conflict_target }}
        uses: actions/github-script@v7
        with:
          script: |
            const conflictTarget = process.env.SYNC_CONFLICT_TARGET || 'unknown';
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Dual-Upstream Sync Conflict - Manual Resolution Required',
              body: `The automated upstream integration for \`master\` encountered a merge conflict.

              **Conflict Target:** ${conflictTarget}

              **Expected Merge Order:**
              1. \`PokemonTCG/pokemon-tcg-data\`
              2. \`JulienGitHub/pokemon-tcg-data\`

              **Action Required:**
              Please resolve the merge conflict on \`master\` manually and rerun the workflow.

              **Suggested steps:**
              1. \`git checkout master\`
              2. \`git fetch --all\`
              3. \`git merge pokemontcg/master\`
              4. \`git merge julien/master\`
              5. Resolve conflicts and \`git push origin master\`
              `,
              labels: ['upstream-sync', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
