# Ein taeglicher Lauf auf master (Spec docs/superpowers/specs/2026-11-13-cardmarket-api-design.md §4):
# TCGdex und Cardmarket laden, pruefen, API bauen, ein Commit, Weitergabe an dev/release, Meldungen.
name: Daily Sync

on:
  schedule:
    # Taeglich 02:00 UTC
    - cron: '0 2 * * *'
    # Rueckfall 05:30 UTC (geplante Laeufe fallen auf Free-Accounts gelegentlich aus). Die Concurrency
    # serialisiert; ein zweiter Lauf mit gleichem Stand aendert nichts (TCGdex unveraendert -> kein Spiegel,
    # Cardmarket-meta bleibt byte-gleich, Build idempotent) und committet daher nicht.
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sync-tcgdex
  cancel-in-progress: false

jobs:
  sync_tcgdex_to_master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: scripts/api
        run: npm ci

      - name: Run tests
        working-directory: scripts/api
        run: npm test

      - name: Sync TCGdex
        run: node scripts/api/sources/sync-tcgdex.mjs

      # Inkrementell: nur neue URLs und seit 7 Tagen fehlende Set-Logos/-Symbole werden angefragt.
      # Ein Netzwerkfehler darf den Lauf nicht abbrechen; der Build nutzt dann den letzten Pruefstand.
      - name: Verify set assets
        continue-on-error: true
        timeout-minutes: 10
        run: node scripts/api/sources/verify-assets.mjs

      # Einzelkarten-Katalog und Preisguide (30 s Timeout, 1 Wiederholung). Endet auch bei Ausfall oder
      # unplausiblen Daten mit Exit 0: Katalog bleibt, Preise bleiben auf Vortagesstand, meta.json zaehlt
      # consecutiveFailures hoch (ab 3 meldet das Issue "Cardmarket-Zuordnung pruefen"). Nur Programmfehler brechen ab.
      - name: Sync Cardmarket
        run: node scripts/api/sources/sync-cardmarket.mjs

      - name: Build matching report
        run: node scripts/api/build-matching.mjs --min-card-match 0.995 --fail-on-pair-drift

      - name: Regression tests against synced sources
        working-directory: scripts/api
        run: node --test test/matching-regression.test.mjs

      - name: Build API v3 and registry
        run: node scripts/api/build-api.mjs

      - name: Commit and push changes
        run: |
          paths="sources/tcgdex sources/cardmarket sources/SOURCES.json api/v3 api/registry"
          git add $paths
          if [ -z "$(git status --porcelain -- $paths)" ]; then
            echo "Keine Aenderungen - nichts zu committen"
            exit 0
          fi
          git commit -m "chore: daily sync (TCGdex, Cardmarket)"
          # master kann sich seit dem Checkout bewegt haben: zwei Versuche mit Rebase.
          for attempt in 1 2; do
            if git pull --rebase origin master && git push origin master; then break; fi
            if [ "$attempt" = 2 ]; then echo "Push nach 2 Versuchen fehlgeschlagen"; exit 1; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done

      # Weitergabe an dev/release nach jedem erfolgreichen Lauf (auch ohne Commit; holt dann eine
      # fehlgeschlagene Weitergabe nach). workflow_dispatch per GITHUB_TOKEN startet Workflows (actions: write);
      # die Definition wird von release gelesen. Ein Fehlschlag hier markiert den Sync nicht als fehlgeschlagen.
      - name: Promote master to dev and release
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'propagate-master-to-dev-release.yml',
                ref: 'release'
              });
              core.info('Weitergabe an dev/release ausgeloest');
            } catch (error) {
              core.warning(`Weitergabe nicht ausgeloest (manuell "Promote Master to Dev and Release" starten): ${error.message}`);
            }

      # Ein selbstpflegendes Issue (Label cardmarket-mapping) aus .cache/cardmarket/issue.json (build-api.mjs,
      # evaluateCardmarketIssue): anlegen, wenn open und keins offen ist; nur den Text aktualisieren, wenn er sich
      # geaendert hat (kein taeglicher Kommentar); mit kurzem Kommentar schliessen, sobald open=false.
      # Ein API-Fehler hier markiert den Sync nicht als fehlgeschlagen (und loest kein TCGdex-Issue aus).
      - name: Update Cardmarket mapping issue
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = '.cache/cardmarket/issue.json';
            if (!fs.existsSync(file)) {
              core.warning(`${file} fehlt - Issue unveraendert`);
              return;
            }
            const result = JSON.parse(fs.readFileSync(file, 'utf8'));
            const { owner, repo } = context.repo;
            const label = 'cardmarket-mapping';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const listed = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 20 });
            const openIssues = listed.data.filter((i) => !i.pull_request);
            if (result.open) {
              const body = result.body.trimEnd();
              if (!openIssues.length) {
                const created = await github.rest.issues.create({ owner, repo, title: result.title, body, labels: [label] });
                core.info(`Issue angelegt: #${created.data.number}`);
                return;
              }
              const issue = openIssues[0];
              if ((issue.body ?? '').replace(/\r\n/g, '\n').trimEnd() !== body || issue.title !== result.title) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, title: result.title, body });
                core.info(`Issue aktualisiert: #${issue.number}`);
              } else {
                core.info(`Issue #${issue.number} unveraendert`);
              }
              return;
            }
            if (!openIssues.length) {
              core.info('Keine Cardmarket-Zuordnungsprobleme, kein offenes Issue');
              return;
            }
            for (const issue of openIssues) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `Keine groben Cardmarket-Zuordnungsprobleme mehr (${runUrl}), Issue geschlossen.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              core.info(`Issue geschlossen: #${issue.number}`);
            }

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'upstream-sync', per_page: 1 });
            if (open.data.length) {
              const existing = open.data[0];
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Der TCGdex-Sync ist erneut fehlgeschlagen: ${runUrl}`
              });
              console.log('Commented on existing issue:', existing.number);
              return;
            }
            const issue = await github.rest.issues.create({
              owner,
              repo,
              title: 'TCGdex-Sync fehlgeschlagen - manuelle Pruefung erforderlich',
              body: `Der taegliche Sync (\`Daily Sync\`) auf \`master\` ist fehlgeschlagen. Es wurde nichts committet.

              **Lauf:** ${runUrl}

              **Moegliche Ursachen:**
              - Tests, Parser oder Plausibilitaetspruefung des Spiegels sind fehlgeschlagen
              - Das Matching hat die Qualitaetsschwelle (0,995) verfehlt, Doppelzuordnungen oder unaufgeloeste Aliase gefunden oder die Set-Paarliste hat sich gegenueber dem letzten Report geaendert
              - Programmfehler im Cardmarket-Schritt (\`sync-cardmarket.mjs\`; ein Ausfall von Cardmarket selbst bricht den Lauf nicht ab)
              - Die Regressionstests gegen die frisch gespiegelten Quellen sind fehlgeschlagen
              - Der v3-Build (Registry eingefroren/Invariante verletzt, Parserfehler, Pflichtfeld fehlt) ist fehlgeschlagen
              - Netzwerk- oder Push-Fehler

              **Erforderliche Aktion:**
              Bitte das Log des Laufs pruefen, die Ursache beheben und den Workflow erneut starten.
              Bei Registry-Drift: Anleitung in [scripts/api/README.md](${context.serverUrl}/${owner}/${repo}/blob/master/scripts/api/README.md#registry-drift-beheben).

              Weitere Fehlschlaege werden als Kommentar an diesem Issue ergaenzt.
              `,
              labels: ['upstream-sync', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
