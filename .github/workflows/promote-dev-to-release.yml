name: Promote Dev to Release

on:
  workflow_run:
    workflows:
      - Verify Dev Preview
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  promote_dev_to_release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into release
        id: promote_release
        run: |
          echo "release_updated=false" >> $GITHUB_OUTPUT
          git fetch origin dev
          BEFORE_COMMIT=$(git rev-parse HEAD)

          if git merge -X theirs origin/dev --no-edit; then
            AFTER_COMMIT=$(git rev-parse HEAD)
            if [ "$BEFORE_COMMIT" != "$AFTER_COMMIT" ]; then
              git push origin release
              echo "release_updated=true" >> $GITHUB_OUTPUT
            else
              echo "Release is already up to date with dev"
            fi
          else
            git merge --abort || true
            exit 1
          fi

      - name: Trigger deploy-pages workflow
        if: steps.promote_release.outputs.release_updated == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-pages.yml',
                ref: 'release'
              });
              core.info('Triggered deploy-pages workflow on release');
            } catch (error) {
              core.warning(`Could not trigger deploy-pages.yml: ${error.message}`);
            }

      - name: Create issue on release promotion conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 Dev-to-Release Promotion Conflict - Manual Resolution Required',
              body: `The automated promotion from \`dev\` to \`release\` encountered a conflict.

              **Action Required:**
              Please resolve the conflict manually on \`release\` and rerun the workflow.

              **Suggested steps:**
              1. \`git checkout release\`
              2. \`git fetch origin dev\`
              3. \`git merge -X theirs origin/dev\`
              4. Resolve conflicts if needed and \`git push origin release\`
              `,
              labels: ['release-merge', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
