name: Verify Dev Preview

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_dev_preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cardmarket helper regressions
        run: node --test scripts/cardmarket/build-cardmarket-data.test.mjs

      - name: Verify Cardmarket frontend helper regressions
        run: node --test frontend/tcg-tracker-web/tests/cardmarket-data.test.mjs

      - name: Verify tracker set-match regressions
        run: node frontend/tcg-tracker-web/tests/set-match-regression.mjs

      - name: Verify generated Cardmarket metadata is present
        run: |
          test -f cardmarket/meta.json
          test -f cardmarket/index/sets.json
          test -f cardmarket/index/products.json
          test -f cardmarket/index/names.json
          test -f cardmarket/index/tracker.json
          test -f frontend/tcg-tracker-web/cardmarket/index/products.json
