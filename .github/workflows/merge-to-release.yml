name: Merge to Release

on:
  push:
    branches:
      - dev   # personal working branch
  workflow_dispatch: # Allow manual trigger

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into release
        run: |
          git fetch origin dev

          # Try to merge dev into release
          if git merge origin/dev --no-edit; then
            echo "Successfully merged dev into release"
            git push origin release
          else
            echo "Merge conflict detected. Creating an issue for manual resolution."
            git merge --abort
            exit 1
          fi

      - name: Create issue on merge conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔀 Release Merge Conflict - Manual Resolution Required',
              body: `The automated merge from dev to release branch encountered a conflict.

              **Action Required:**
              Please manually merge dev into release and resolve any conflicts.

              **Steps:**
              1. \`git checkout release\`
              2. \`git merge dev\`
              3. Resolve conflicts
              4. \`git push origin release\`

              The GitHub Pages deployment will automatically update once this is resolved.`,
              labels: ['release-merge', 'manual-action-required']
            });
            console.log('Created issue:', issue.data.number);
